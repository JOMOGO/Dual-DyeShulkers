pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://maven.kikugie.me/releases" }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
    create(rootProject) {
        versions "26.2", "26.3"
    }
}

rootProject.name = "dual-dye-shulkers"
