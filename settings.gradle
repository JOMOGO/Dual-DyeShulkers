pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://maven.kikugie.me/releases" }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.8.3'
    // Auto-provisions the JDK 21 used to launch Minecraft (see build.gradle)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    create(rootProject) {
        versions "1.21.1", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8"
    }
}

rootProject.name = "dual-dye-shulkers"
