plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.8.7'
}

// Load version-specific properties from stonecutter.json
def scVersion = stonecutter.current.version
def scJson = new groovy.json.JsonSlurper().parse(project.rootProject.file("versions/${scVersion}/stonecutter.json"))

// Set project properties from the JSON
ext {
    minecraft_version = scJson.minecraft_version
    fabric_version = scJson.fabric_version
    cloth_config_version = scJson.cloth_config_version
    modmenu_version = scJson.modmenu_version
    modmenu_modrinth_id = scJson.modmenu_modrinth_id
}

// Calculate numeric MC version for preprocessor (e.g., "1.21.4" -> 12104)
def versionParts = minecraft_version.split('\\.')
def major = versionParts[0].toInteger()
def minor = versionParts[1].toInteger()
def patch = versionParts.length > 2 ? versionParts[2].toInteger() : 0
def mcVersionNum = major * 10000 + minor * 100 + patch
println "MC Version: ${minecraft_version} -> Num: ${mcVersionNum}"

// Configure Stonecutter preprocessor
stonecutter {
    // Define MC as a dependency for version checks in code
    // Used as: //? if MC: >=12102 { ... //?}
    dependencies["MC"] = mcVersionNum.toString()
}

version = "${project.mod_version}+${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.shedaniel.me/" }
    // ModMenu via Modrinth maven (terraformersmc maven is unreliable)
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    def awFile = project.rootProject.file("src/main/resources/multicolor-shulkers.accesswidener")
    accessWidenerPath = stonecutter.process(awFile, "build/processed.accesswidener")

    mods {
        "multicolor-shulkers" {
            sourceSet sourceSets.main
        }
    }
}

// End-to-end tests (Fabric GameTest + Client GameTest), sources in src/gametest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "multicolor-shulkers-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Only configure run settings for the active version (gametest runs keep their own run dirs)
if (stonecutter.current.isActive) {
    loom {
        runConfigs.matching { it.name in ["client", "server"] }.configureEach {
            ideConfigGenerated = true
            runDir "../../run"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Config GUI (optional dependencies)
    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // ModMenu ${modmenu_version} resolved via Modrinth maven by version id
    api "maven.modrinth:modmenu:${modmenu_modrinth_id}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "minecraft_version": minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.compilerArgs << "-Xdiags:verbose"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "dual-dye-shulkers"
    versionNumber = project.mod_version
    versionName = project.mod_version
    versionType = "release"
    uploadFile = jar
    changelog = getChangelog(project.mod_version)
    gameVersions = [minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        optional.project "cloth-config"
        optional.project "modmenu"
    }
    syncBodyFrom = rootProject.file("README.md").text
}

def getChangelog(version) {
    def changelogFile = rootProject.file("CHANGELOG.md")
    if (!changelogFile.exists()) return ""
    
    def lines = changelogFile.readLines()
    def log = new StringBuilder()
    def recording = false
    
    for (line in lines) {
        if (line.startsWith("## [${version}]")) {
            recording = true
            continue
        }
        if (recording && line.startsWith("## [")) {
            break
        }
        if (recording) {
            log.append(line).append("\n")
        }
    }
    return log.toString().trim()
}
