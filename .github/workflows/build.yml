name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: chmod +x gradlew && ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dual-dye-shulkers
          path: versions/*/build/libs/*.jar

  # End-to-end: real Minecraft client (Fabric Client GameTest) under a virtual display.
  # 1.21.1 and 1.21.4 use older test APIs and are not covered yet.
  client-gametest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_version: ["1.21.5", "1.21.6", "1.21.7", "1.21.8"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Run client gametests
        run: chmod +x gradlew && xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew ${{ matrix.mc_version }}:runClientGameTest

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: client-gametest-screenshots-${{ matrix.mc_version }}
          path: versions/${{ matrix.mc_version }}/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
