name: Sync Modrinth page

# Pushes README.md to the Modrinth project description (no version is published).
on:
  push:
    branches: [26.x]
    paths:
      - "README.md"
      - ".github/workflows/modrinth-sync.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync README to Modrinth
        run: chmod +x gradlew && ./gradlew 26.3:modrinthSyncBody
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
